name: Deploy frontend mirror
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fishing_mode:
        description: Fishing release mode (stop-new retains pending catch confirmation)
        required: true
        default: open
        type: choice
        options: [open, stop-new]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_HARBOR_PLATFORM_TOKEN_MODE: candidate-token-owner-v1
          HARBOR_FISHING_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.fishing_mode || 'open' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
